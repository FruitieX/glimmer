[package]
name = "twinkly"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
futures-util = "0.3.34"
rand = "0.10.3"
rquickjs = "0.14.0"
rumqttc = { version = "0.25.1", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.0", features = ["json"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
